purpose:
  brief: "Define the architectural and simulation logic for the tower building simulator."
  expanded:
    axiomatic_intent: "The building is a discrete grid of modules, not a network of nodes. The fundamental unit is a grid cell."
    axiological_intent: "We prioritize spatial efficiency, resource propagation, and simulation depth."
    teleological_intent: "To build a high-performance, WebGL2-accelerated tower management simulator."

simulation_logic:
  grid_system:
    base_unit: "StructuralAtom (1:1 square, reference only)."
    working_unit: "StructuralCell (1:4 ratio, default working-grid unit)."
    modular_unit: "StructuralRoom/StructuralUnit (composed of multiple StructuralCells)."
    aspect_ratio: "1:4 (width:height) for StructuralCells."
    modular_footprints: "Fixed dimensions based on StructuralCell count (e.g., 4x1)."
    verticality: "Floor-based height (1 StructuralCell height = 1 floor)."
    propagation: "Resources (power, water) propagate through the grid network."

  grid_terminology:
    StructuralAtom: "Sub-grid unit (1:1 square), used for reference only."
    StructuralCell: "Working-grid unit (1:4 ratio), the default unit for placement and simulation logic."
    StructuralRoom: "Cumulative object composed of several StructuralCells (also referred to as StructuralUnit)."
    grid_coordinate: "Index [x, y] representing StructuralCell position."

  alignment_strategy:
    grid_snapping: "Constrain all module placements to a predefined grid (GRID_SIZE)."
    spatial_constraints: "Modules must have support, access, and utility connections."
    visual_grid_reference: "Visual grid displays a 4x1 StructuralCell footprint as a single grid space."

  implementation_plan:
    phase_1_data_model: "Replace shapes/links with TowerGrid (spatial hash map)."
    phase_2_ui_ux: "Transform Toolbar into a construction menu for building modules."
    phase_3_simulation: "Implement time-based simulation loop for resources."
    phase_4_visuals: "Transition rendering from flowchart nodes to building modules."

  rendering_engine:
    type: "Three.js 3D scene."
    style: "2D side-view using SDFs (Signed Distance Fields)."
    performance: "Resolution-independent rendering at 60fps."
